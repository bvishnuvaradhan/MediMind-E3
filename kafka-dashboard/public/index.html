<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MediMind – Kafka & Microservices Control Plane</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #070d19;
      color: #e2e8f0;
    }
    code, pre {
      font-family: 'JetBrains Mono', monospace;
    }
    .glass-panel {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .glass-card {
      background: rgba(30, 41, 59, 0.55);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.07);
    }
    .pulse-glow {
      box-shadow: 0 0 15px rgba(16, 185, 129, 0.35);
    }
    /* Custom scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #0f172a;
    }
    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 3px;
    }
  </style>
</head>
<body class="min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useCallback } = React;

    function App() {
      const [activeTab, setActiveTab] = useState('overview');
      const [overview, setOverview] = useState(null);
      const [topics, setTopics] = useState([]);
      const [consumerGroups, setConsumerGroups] = useState([]);
      const [eurekaData, setEurekaData] = useState(null);
      const [selectedTopic, setSelectedTopic] = useState('medimind.predictions');
      const [messages, setMessages] = useState([]);
      const [loadingMessages, setLoadingMessages] = useState(false);
      const [lastRefreshed, setLastRefreshed] = useState(new Date());
      const [refreshCountdown, setRefreshCountdown] = useState(5);

      const fetchData = useCallback(async () => {
        try {
          const [ovRes, topRes, grpRes, eurRes] = await Promise.all([
            fetch('/api/kafka/overview').then(r => r.json()).catch(() => null),
            fetch('/api/kafka/topics').then(r => r.json()).catch(() => ({ topics: [] })),
            fetch('/api/kafka/consumer-groups').then(r => r.json()).catch(() => ({ groups: [] })),
            fetch('/api/eureka/status').then(r => r.json()).catch(() => null),
          ]);

          if (ovRes) setOverview(ovRes);
          if (topRes?.topics) setTopics(topRes.topics);
          if (grpRes?.groups) setConsumerGroups(grpRes.groups);
          if (eurRes) setEurekaData(eurRes);
          setLastRefreshed(new Date());
          setRefreshCountdown(5);
        } catch (err) {
          console.error('Fetch error:', err);
        }
      }, []);

      const fetchMessages = useCallback(async (topicName) => {
        if (!topicName) return;
        setLoadingMessages(true);
        try {
          const res = await fetch(`/api/kafka/topics/${encodeURIComponent(topicName)}/messages?limit=50`);
          const data = await res.json();
          setMessages(data.messages || []);
        } catch (err) {
          console.error('Messages fetch error:', err);
        } finally {
          setLoadingMessages(false);
        }
      }, []);

      // Auto-refresh interval (5 seconds)
      useEffect(() => {
        fetchData();
        const interval = setInterval(() => {
          fetchData();
        }, 5000);
        return () => clearInterval(interval);
      }, [fetchData]);

      // Countdown timer tick
      useEffect(() => {
        const timer = setInterval(() => {
          setRefreshCountdown(prev => (prev > 1 ? prev - 1 : 5));
        }, 1000);
        return () => clearInterval(timer);
      }, []);

      // Fetch messages on tab or topic change
      useEffect(() => {
        if (activeTab === 'messages' && selectedTopic) {
          fetchMessages(selectedTopic);
        }
      }, [activeTab, selectedTopic, fetchMessages]);

      const isConnected = overview?.connected;

      return (
        <div class="flex h-screen overflow-hidden">
          {/* Sidebar */}
          <aside class="w-64 glass-panel border-r border-slate-800 flex flex-col justify-between z-20">
            <div>
              {/* Logo / Brand Header */}
              <div class="p-6 border-b border-slate-800/80">
                <div class="flex items-center space-x-3">
                  <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-teal-500 to-cyan-400 flex items-center justify-center shadow-lg shadow-teal-500/20">
                    <svg class="w-5 h-5 text-slate-950 font-bold" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M13 10V3L4 14h7v7l9-11h-7z" />
                    </svg>
                  </div>
                  <div>
                    <h1 class="font-bold text-lg text-white tracking-wide">MediMind</h1>
                    <p class="text-xs text-teal-400 font-medium">Kafka Control Plane</p>
                  </div>
                </div>
              </div>

              {/* Navigation Items */}
              <nav class="p-4 space-y-1">
                {[
                  { id: 'overview', label: 'Cluster Overview', icon: 'M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z' },
                  { id: 'topics', label: 'Kafka Topics', icon: 'M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10' },
                  { id: 'messages', label: 'Message Browser', icon: 'M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z' },
                  { id: 'groups', label: 'Consumer Groups', icon: 'M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z' },
                  { id: 'eureka', label: 'Eureka Services', icon: 'M5 12h14M5 12a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v4a2 2 0 01-2 2M5 12a2 2 0 00-2 2v4a2 2 0 002 2h14a2 2 0 002-2v-4a2 2 0 00-2-2m-2-4h.01M17 16h.01' }
                ].map(item => (
                  <button
                    key={item.id}
                    onClick={() => setActiveTab(item.id)}
                    class={`w-full flex items-center space-x-3 px-4 py-3 rounded-xl text-sm font-medium transition-all ${
                      activeTab === item.id
                        ? 'bg-gradient-to-r from-teal-500/20 to-cyan-500/10 text-teal-300 border border-teal-500/30'
                        : 'text-slate-400 hover:text-slate-200 hover:bg-slate-800/50'
                    }`}
                  >
                    <svg class="w-5 h-5 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d={item.icon} />
                    </svg>
                    <span>{item.label}</span>
                  </button>
                ))}
              </nav>
            </div>

            {/* Bottom Status Badge */}
            <div class="p-4 border-t border-slate-800/80">
              <div class="glass-card p-3 rounded-xl flex items-center justify-between">
                <div class="flex items-center space-x-2.5">
                  <span class={`w-2.5 h-2.5 rounded-full ${isConnected ? 'bg-emerald-400 pulse-glow' : 'bg-rose-500'}`}></span>
                  <span class="text-xs font-semibold text-slate-300">
                    {isConnected ? 'Kafka Online' : 'Kafka Offline'}
                  </span>
                </div>
                <span class="text-[10px] text-slate-500 font-mono">
                  {refreshCountdown}s
                </span>
              </div>
            </div>
          </aside>

          {/* Main Dashboard Workspace */}
          <main class="flex-1 flex flex-col overflow-hidden bg-slate-950/60">
            {/* Top Toolbar */}
            <header class="h-16 glass-panel border-b border-slate-800/80 px-8 flex items-center justify-between z-10">
              <div class="flex items-center space-x-3">
                <h2 class="text-lg font-semibold text-white capitalize">{activeTab.replace('-', ' ')}</h2>
                <span class="text-xs text-slate-500 font-mono">localhost:9092</span>
              </div>

              <div class="flex items-center space-x-4">
                <span class="text-xs text-slate-400">
                  Last updated: <span class="font-mono text-slate-300">{lastRefreshed.toLocaleTimeString()}</span>
                </span>
                <button
                  onClick={fetchData}
                  class="px-3 py-1.5 rounded-lg text-xs font-medium bg-slate-800 hover:bg-slate-700 text-slate-300 transition-colors flex items-center space-x-1.5 border border-slate-700"
                >
                  <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                  </svg>
                  <span>Refresh Now</span>
                </button>
              </div>
            </header>

            {/* Scrollable Content Area */}
            <div class="flex-1 overflow-y-auto p-8 space-y-8">
              {/* Top Metric Cards */}
              <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-6 gap-4">
                <MetricCard
                  title="Broker Status"
                  value={isConnected ? 'CONNECTED' : 'OFFLINE'}
                  sub={isConnected ? `${overview?.brokersCount} Broker (KRaft)` : 'Broker unreachable'}
                  accent={isConnected ? 'emerald' : 'rose'}
                />
                <MetricCard
                  title="Total Topics"
                  value={overview?.totalTopics ?? 0}
                  sub="Active in cluster"
                  accent="teal"
                />
                <MetricCard
                  title="Total Partitions"
                  value={overview?.totalPartitions ?? 0}
                  sub="Distributed replicas"
                  accent="cyan"
                />
                <MetricCard
                  title="Available Events"
                  value={overview?.totalMessages ?? 0}
                  sub="Stored across topics"
                  accent="indigo"
                />
                <MetricCard
                  title="Consumer Groups"
                  value={overview?.consumerGroupCount ?? 0}
                  sub="Active workers"
                  accent="violet"
                />
                <MetricCard
                  title="Eureka Services"
                  value={eurekaData?.online ? eurekaData.servicesCount : 'OFFLINE'}
                  sub={eurekaData?.online ? 'Port 8761' : 'Registry offline'}
                  accent={eurekaData?.online ? 'emerald' : 'amber'}
                />
              </div>

              {/* Tab 1: Overview */}
              {activeTab === 'overview' && (
                <div class="space-y-6">
                  {/* Cluster Specs */}
                  <div class="glass-card rounded-2xl p-6">
                    <h3 class="text-sm font-semibold text-slate-300 uppercase tracking-wider mb-4">Cluster Metadata</h3>
                    <div class="grid grid-cols-1 md:grid-cols-4 gap-6 text-sm">
                      <div>
                        <span class="text-xs text-slate-500 block">Bootstrap Brokers</span>
                        <span class="font-mono text-slate-200">{overview?.brokers?.join(', ') || 'localhost:9092'}</span>
                      </div>
                      <div>
                        <span class="text-xs text-slate-500 block">Cluster Identifier</span>
                        <span class="font-mono text-slate-200">{overview?.clusterId || 'kraft-cluster'}</span>
                      </div>
                      <div>
                        <span class="text-xs text-slate-500 block">KRaft Controller Node</span>
                        <span class="font-mono text-slate-200">Node #{overview?.controllerNode ?? 1}</span>
                      </div>
                      <div>
                        <span class="text-xs text-slate-500 block">Monitoring Server</span>
                        <span class="font-mono text-emerald-400">localhost:8080 (Read-Only)</span>
                      </div>
                    </div>
                  </div>

                  {/* Active Topics Overview Table */}
                  <div class="glass-card rounded-2xl p-6">
                    <div class="flex items-center justify-between mb-4">
                      <h3 class="text-sm font-semibold text-slate-300 uppercase tracking-wider">Active MediMind Topics</h3>
                      <button
                        onClick={() => setActiveTab('topics')}
                        class="text-xs text-teal-400 hover:text-teal-300 font-medium"
                      >
                        View Partition Details →
                      </button>
                    </div>

                    <div class="overflow-x-auto">
                      <table class="w-full text-left text-sm">
                        <thead class="text-xs text-slate-400 uppercase border-b border-slate-800 pb-2">
                          <tr>
                            <th class="py-3 px-4">Topic Name</th>
                            <th class="py-3 px-4">Partitions</th>
                            <th class="py-3 px-4">Message Count</th>
                            <th class="py-3 px-4">Actions</th>
                          </tr>
                        </thead>
                        <tbody class="divide-y divide-slate-800/60">
                          {topics.map(t => (
                            <tr key={t.name} class="hover:bg-slate-800/30 transition-colors">
                              <td class="py-3.5 px-4 font-mono font-medium text-white flex items-center space-x-2">
                                <span class="w-2 h-2 rounded-full bg-teal-400"></span>
                                <span>{t.name}</span>
                              </td>
                              <td class="py-3.5 px-4 text-slate-300">{t.partitionCount}</td>
                              <td class="py-3.5 px-4 font-mono text-indigo-300">{t.totalMessages}</td>
                              <td class="py-3.5 px-4">
                                <button
                                  onClick={() => {
                                    setSelectedTopic(t.name);
                                    setActiveTab('messages');
                                  }}
                                  class="px-2.5 py-1 rounded text-xs bg-teal-500/10 hover:bg-teal-500/20 text-teal-300 border border-teal-500/20"
                                >
                                  Inspect Messages
                                </button>
                              </td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  </div>
                </div>
              )}

              {/* Tab 2: Topics */}
              {activeTab === 'topics' && (
                <div class="space-y-6">
                  {topics.map(t => (
                    <div key={t.name} class="glass-card rounded-2xl p-6 space-y-4">
                      <div class="flex items-center justify-between border-b border-slate-800 pb-3">
                        <div class="flex items-center space-x-3">
                          <span class="w-3 h-3 rounded-full bg-teal-400"></span>
                          <h3 class="font-mono text-base font-bold text-white">{t.name}</h3>
                          <span class="text-xs bg-slate-800 px-2.5 py-0.5 rounded-full text-slate-300 border border-slate-700">
                            {t.partitionCount} Partitions
                          </span>
                        </div>
                        <div class="text-sm text-slate-400 font-mono">
                          Total Messages: <span class="text-emerald-400 font-bold">{t.totalMessages}</span>
                        </div>
                      </div>

                      <div class="overflow-x-auto">
                        <table class="w-full text-left text-xs">
                          <thead class="text-slate-500 uppercase border-b border-slate-800/80">
                            <tr>
                              <th class="py-2.5 px-3">Partition ID</th>
                              <th class="py-2.5 px-3">Leader Node</th>
                              <th class="py-2.5 px-3">Replicas</th>
                              <th class="py-2.5 px-3">In-Sync Replicas (ISR)</th>
                              <th class="py-2.5 px-3">Low Offset</th>
                              <th class="py-2.5 px-3">High Offset</th>
                              <th class="py-2.5 px-3">Available Records</th>
                            </tr>
                          </thead>
                          <tbody class="divide-y divide-slate-800/40 font-mono">
                            {(t.partitions || []).map(p => (
                              <tr key={p.partitionId} class="hover:bg-slate-800/20">
                                <td class="py-2.5 px-3 font-semibold text-slate-200">Partition #{p.partitionId}</td>
                                <td class="py-2.5 px-3 text-slate-400">Node #{p.leader}</td>
                                <td class="py-2.5 px-3 text-slate-400">[{p.replicas?.join(', ')}]</td>
                                <td class="py-2.5 px-3 text-emerald-400">[{p.isr?.join(', ')}]</td>
                                <td class="py-2.5 px-3 text-slate-400">{p.lowOffset}</td>
                                <td class="py-2.5 px-3 text-slate-300">{p.highOffset}</td>
                                <td class="py-2.5 px-3 text-indigo-300 font-bold">{p.messageCount}</td>
                              </tr>
                            ))}
                          </tbody>
                        </table>
                      </div>
                    </div>
                  ))}
                </div>
              )}

              {/* Tab 3: Messages */}
              {activeTab === 'messages' && (
                <div class="space-y-6">
                  {/* Selector & Actions */}
                  <div class="glass-card rounded-2xl p-6 flex flex-col md:flex-row items-center justify-between gap-4">
                    <div class="flex items-center space-x-3 w-full md:w-auto">
                      <label class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Select Topic:</label>
                      <select
                        value={selectedTopic}
                        onChange={(e) => setSelectedTopic(e.target.value)}
                        class="bg-slate-900 border border-slate-700 text-white rounded-xl px-4 py-2 text-sm font-mono focus:outline-none focus:border-teal-500"
                      >
                        {topics.map(t => (
                          <option key={t.name} value={t.name}>{t.name}</option>
                        ))}
                      </select>
                    </div>

                    <div class="flex items-center space-x-3">
                      <span class="text-xs text-slate-400 font-mono">
                        {messages.length} Events Read (Bounded, Non-Destructive)
                      </span>
                      <button
                        onClick={() => fetchMessages(selectedTopic)}
                        class="px-4 py-2 rounded-xl text-xs font-medium bg-teal-500 hover:bg-teal-400 text-slate-950 font-semibold transition-colors flex items-center space-x-1.5"
                      >
                        <svg class={`w-4 h-4 ${loadingMessages ? 'animate-spin' : ''}`} fill="none" viewBox="0 0 24 24" stroke="currentColor">
                          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                        </svg>
                        <span>Query Messages</span>
                      </button>
                    </div>
                  </div>

                  {/* Message Stream */}
                  {loadingMessages ? (
                    <div class="glass-card rounded-2xl p-12 text-center text-slate-400">
                      <div class="inline-block animate-spin w-8 h-8 border-4 border-teal-500 border-t-transparent rounded-full mb-3"></div>
                      <p class="text-sm">Reading live records from Kafka brokers...</p>
                    </div>
                  ) : messages.length === 0 ? (
                    <div class="glass-card rounded-2xl p-12 text-center text-slate-500">
                      <svg class="w-12 h-12 mx-auto mb-3 opacity-40" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4" />
                      </svg>
                      <p class="text-sm font-medium">No messages currently in topic <span class="font-mono text-slate-400">{selectedTopic}</span>.</p>
                      <p class="text-xs text-slate-600 mt-1">Execute an appointment booking or prediction in MediMind to stream live events.</p>
                    </div>
                  ) : (
                    <div class="space-y-4">
                      {messages.map((m, idx) => (
                        <div key={`${m.partition}-${m.offset}-${idx}`} class="glass-card rounded-2xl p-5 border border-slate-800/80 hover:border-slate-700 transition-all">
                          <div class="flex flex-wrap items-center justify-between gap-2 border-b border-slate-800/60 pb-3 mb-3">
                            <div class="flex items-center space-x-3">
                              <span class="px-2.5 py-0.5 rounded text-xs font-semibold bg-teal-500/20 text-teal-300 border border-teal-500/30">
                                {m.eventType}
                              </span>
                              <span class="font-mono text-xs text-slate-400">
                                Event ID: <span class="text-white">{m.eventId || 'N/A'}</span>
                              </span>
                            </div>

                            <div class="flex items-center space-x-4 text-xs font-mono text-slate-400">
                              <span>Part: <span class="text-slate-200">{m.partition}</span></span>
                              <span>Offset: <span class="text-slate-200">{m.offset}</span></span>
                              <span>Time: <span class="text-slate-300">{m.timestamp || 'N/A'}</span></span>
                            </div>
                          </div>

                          <div class="bg-slate-950/80 rounded-xl p-4 overflow-x-auto text-xs font-mono text-teal-300/90 border border-slate-900">
                            <pre>{JSON.stringify(m.payload, null, 2)}</pre>
                          </div>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              )}

              {/* Tab 4: Consumer Groups */}
              {activeTab === 'groups' && (
                <div class="glass-card rounded-2xl p-6">
                  <h3 class="text-sm font-semibold text-slate-300 uppercase tracking-wider mb-4">Registered Kafka Consumer Groups</h3>
                  {consumerGroups.length === 0 ? (
                    <p class="text-xs text-slate-500">No active consumer groups currently registered.</p>
                  ) : (
                    <div class="overflow-x-auto">
                      <table class="w-full text-left text-sm">
                        <thead class="text-xs text-slate-400 uppercase border-b border-slate-800">
                          <tr>
                            <th class="py-3 px-4">Group ID</th>
                            <th class="py-3 px-4">State</th>
                            <th class="py-3 px-4">Protocol</th>
                            <th class="py-3 px-4">Active Members</th>
                          </tr>
                        </thead>
                        <tbody class="divide-y divide-slate-800 font-mono text-xs">
                          {consumerGroups.map(g => (
                            <tr key={g.groupId} class="hover:bg-slate-800/30">
                              <td class="py-3.5 px-4 font-semibold text-white">{g.groupId}</td>
                              <td class="py-3.5 px-4">
                                <span class={`px-2 py-0.5 rounded text-[11px] ${
                                  g.state === 'Stable' ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30' : 'bg-slate-800 text-slate-400'
                                }`}>
                                  {g.state || 'Active'}
                                </span>
                              </td>
                              <td class="py-3.5 px-4 text-slate-400">{g.protocol || 'consumer'}</td>
                              <td class="py-3.5 px-4 text-slate-300">{g.membersCount}</td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  )}
                </div>
              )}

              {/* Tab 5: Eureka Services */}
              {activeTab === 'eureka' && (
                <div class="space-y-6">
                  <div class="glass-card rounded-2xl p-6">
                    <div class="flex items-center justify-between mb-4">
                      <div>
                        <h3 class="text-base font-bold text-white">Netflix Eureka Service Registry</h3>
                        <p class="text-xs text-slate-400">Server listening on http://localhost:8761</p>
                      </div>
                      <span class={`px-3 py-1 rounded-full text-xs font-semibold ${
                        eurekaData?.online ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30' : 'bg-rose-500/20 text-rose-400'
                      }`}>
                        {eurekaData?.online ? `${eurekaData.servicesCount} Services UP` : 'Offline'}
                      </span>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 mt-6">
                      {(eurekaData?.applications || []).map(app => (
                        <div key={app.name} class="bg-slate-900/80 p-4 rounded-xl border border-slate-800 space-y-2">
                          <div class="flex items-center justify-between">
                            <span class="font-bold text-sm text-teal-300 font-mono">{app.name}</span>
                            <span class="w-2 h-2 rounded-full bg-emerald-400"></span>
                          </div>
                          {(app.instances || []).map(inst => (
                            <div key={inst.instanceId} class="text-xs font-mono text-slate-400 space-y-1 pt-2 border-t border-slate-800/80">
                              <div>ID: <span class="text-slate-300">{inst.instanceId}</span></div>
                              <div>Address: <span class="text-slate-300">{inst.ipAddr}:{inst.port}</span></div>
                              <div>Health: <a href={inst.healthCheckUrl} target="_blank" class="text-teal-400 hover:underline">{inst.healthCheckUrl}</a></div>
                            </div>
                          ))}
                        </div>
                      ))}
                    </div>
                  </div>
                </div>
              )}
            </div>
          </main>
        </div>
      );
    }

    function MetricCard({ title, value, sub, accent }) {
      const accents = {
        emerald: 'text-emerald-400 border-emerald-500/20',
        teal: 'text-teal-400 border-teal-500/20',
        cyan: 'text-cyan-400 border-cyan-500/20',
        indigo: 'text-indigo-400 border-indigo-500/20',
        violet: 'text-violet-400 border-violet-500/20',
        amber: 'text-amber-400 border-amber-500/20',
        rose: 'text-rose-400 border-rose-500/20',
      };

      return (
        <div class="glass-card rounded-2xl p-4 flex flex-col justify-between">
          <span class="text-[11px] font-semibold text-slate-400 uppercase tracking-wider">{title}</span>
          <div class="my-2">
            <span class={`text-2xl font-bold font-mono tracking-tight ${accents[accent] || 'text-white'}`}>
              {value}
            </span>
          </div>
          <span class="text-[11px] text-slate-500">{sub}</span>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
